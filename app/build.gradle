plugins {
    id 'com.android.application'
}

android {
    namespace 'it.migelino.dettato'
    compileSdk 34

    defaultConfig {
        applicationId 'it.migelino.dettato'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
